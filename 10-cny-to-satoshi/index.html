<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>10 CNY to Satoshi | Convert 10 Yuan to Sats</title>
  <meta name="description" content="Convert 10 CNY to satoshis using the current Bitcoin price." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://satoshi-converter.com/10-cny-to-satoshi/" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="wrap"><a class="brand" href="/">Satoshi Converter</a></header>
<main class="wrap"><section class="hero">
  <h1>10 CNY to Satoshi</h1>
  <p class="subtitle">Convert <strong>10 Chinese yuan (CNY)</strong> to <strong>satoshis (sats)</strong> using the current Bitcoin price.</p>
  <div class="card"><p class="result-big"><strong id="result">— satoshis</strong></p></div>
  <footer class="footer"><p>© <span id="year"></span> satoshi-converter.com</p></footer>
</section></main>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=cny")
.then(r=>r.json()).then(d=>{
  const sats=Math.round((10/d.bitcoin.cny)*100000000);
  document.getElementById("result").textContent=sats.toLocaleString()+" satoshis";
}).catch(()=>{document.getElementById("result").textContent="Conversion unavailable";});
</script>
</body>
</html>
