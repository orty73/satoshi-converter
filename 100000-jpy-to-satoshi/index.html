<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>100000 JPY to Satoshi | Convert 100,000 Yen to Sats</title>
  <meta name="description" content="Convert 100000 JPY to satoshis using the current Bitcoin price. See how many sats you get for 100,000 Japanese yen." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://satoshi-converter.com/100000-jpy-to-satoshi/" />

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
<header class="wrap"><a class="brand" href="/">Satoshi Converter</a></header>

<main class="wrap">
<section class="hero">
  <h1>100000 JPY to Satoshi</h1>
  <p class="subtitle">Convert <strong>100,000 Japanese yen (JPY)</strong> to <strong>satoshis (sats)</strong> using the current Bitcoin price.</p>

  <div class="card">
    <p class="result-big"><strong id="result">— satoshis</strong></p>
    <p class="note">Estimate based on the latest BTC market price.</p>
  </div>

  <footer class="footer">
    <p>© <span id="year"></span> satoshi-converter.com · Not financial advice</p>
  </footer>
</section>
</main>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=jpy")
.then(r=>r.json())
.then(d=>{
  const sats = Math.round((100000 / d.bitcoin.jpy) * 100000000);
  document.getElementById("result").textContent = sats.toLocaleString() + " satoshis";
})
.catch(()=>{ document.getElementById("result").textContent="Conversion unavailable";});
</script>
</body>
</html>
